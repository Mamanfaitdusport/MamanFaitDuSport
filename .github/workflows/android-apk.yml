name: Android APK

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Capacitor 8 → JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: android

      - name: Renommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk carnet-sport-build-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: carnet-sport-apk
          path: carnet-sport-build-${{ github.run_number }}.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: Carnet Sport build ${{ github.run_number }}
          body: |
            APK debug du Carnet Sport (commit ${{ github.sha }}, branche ${{ github.ref_name }}).
            Sur le téléphone : télécharger le fichier .apk ci-dessous, puis autoriser l'installation depuis des sources inconnues.
          files: carnet-sport-build-${{ github.run_number }}.apk
